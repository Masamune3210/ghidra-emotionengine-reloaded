name: Validate CCC 2.x bitfield layout

on:
  push:
    branches: ["note-working/ccc2-symbol-import"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccc2_bitfield_layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'
      - name: Setup Ghidra
        uses: antoniovazquezblanco/setup-ghidra@029b00367e561cef07baacedb6de5e007a1ebc9a
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: '12.1.3'
      - name: Compile and test bitfield geometry
        run: gradle -PGHIDRA_INSTALL_DIR=${{ env.GHIDRA_INSTALL_DIR }} test --tests ghidra.emotionengine.symboltable.Ccc2BitfieldLayoutTest
