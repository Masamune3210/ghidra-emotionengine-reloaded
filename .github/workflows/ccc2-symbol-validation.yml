name: Validate CCC 2.x importer

on:
  push:
    branches: ["note-working/ccc2-symbol-import", "note-working/ccc2-function-creation-20261018"]
    paths-ignore:
      - "docs/**"
      - "ghidra_scripts/**"
  workflow_dispatch:

concurrency:
  group: ccc2-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ccc2_importer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghidra: ['12.1.3', '12.1.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'
      - name: Setup Ghidra
        uses: antoniovazquezblanco/setup-ghidra@029b00367e561cef07baacedb6de5e007a1ebc9a
        with:
          auth_token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.ghidra }}
      - name: Compile and run all unit tests
        run: gradle -PGHIDRA_INSTALL_DIR=${{ env.GHIDRA_INSTALL_DIR }} test
